name: Deploy Feed Bucket PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify unified release version
        id: release
        shell: bash
        run: |
          release_version="$(jq -r '.release // empty' site/release.json)"
          semantic_version="$(jq -r '.version // empty' site/version.json)"
          build_number="$(jq -r '.build_number // empty' site/version.json)"
          expected_release="${semantic_version}+${build_number}"

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Invalid release version: $release_version" >&2
            exit 1
          fi

          if [[ "$release_version" != "$expected_release" ]]; then
            echo "Release metadata mismatch: expected $expected_release, found $release_version" >&2
            exit 1
          fi

          echo "value=$release_version" >> "$GITHUB_OUTPUT"

      - name: Stamp PWA cache version
        shell: bash
        run: |
          app_version="${{ steps.release.outputs.value }}"
          sed -i "s/__APP_VERSION__/${app_version}/g" site/index.html
          sed -i "s/__APP_VERSION__/${app_version}/g" site/pwa_service_worker.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
